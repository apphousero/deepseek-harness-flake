name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Apply this version bump before checking
        type: string
        required: false
        default: ""
      digest:
        description: sha256 the bumped package.nix and pnpm lock must hash to
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: assert runner system
        env:
          EXPECTED: ${{ matrix.system }}
        run: |
          actual=$(nix eval --raw --impure --expr builtins.currentSystem)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "runner reports $actual, matrix claims $EXPECTED" >&2
            exit 1
          fi

      - name: apply pending bump
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.digest }}
        run: |
          nix run .#update -- "$VERSION"
          if [ -n "$DIGEST" ]; then
            actual=$(sha256sum package.nix npm/package.json npm/pnpm-lock.yaml | sha256sum | cut -d' ' -f1)
            if [ "$actual" != "$DIGEST" ]; then
              echo "the bump hashes to $actual, run resolved $DIGEST; upstream packages moved mid-run" >&2
              exit 1
            fi
          fi

      - name: diagnose sharp on x86_64 (temporary)
        if: matrix.system == 'x86_64-linux'
        continue-on-error: true
        run: |
          grep -o 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          mkdir -p /tmp/sharptest && cd /tmp/sharptest && npm init -y >/dev/null
          npm i --ignore-scripts --no-audit --no-fund sharp@0.35.3 >/dev/null
          node -e 'const s=require("sharp");console.log("ubuntu-glibc sharp OK",JSON.stringify(s.versions))'
          echo "ubuntu-glibc exit=$?"
          cd "$GITHUB_WORKSPACE"
          out=$(nix build --impure --no-link --print-out-paths --expr 'let f = builtins.getFlake (toString ./.); in f.packages.x86_64-linux.deepseek-harness.overrideAttrs { doInstallCheck = false; }')
          echo "store output: $out"
          anchor="$out/lib/deepseek-harness/node_modules/@deepseek-ai/dsh/package.json"
          nix shell nixpkgs#gdb nixpkgs#nodejs --command gdb -batch -ex run -ex 'bt 25' -ex 'info sharedlibrary' \
            --args node -e 'require("node:module").createRequire(process.argv[1])("sharp")' "$anchor" 2>&1 | tail -60

      - name: flake check
        run: nix flake check -L

      - name: run the built binary
        run: nix run .#deepseek-harness -- --version
